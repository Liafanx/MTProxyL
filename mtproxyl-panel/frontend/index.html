<!DOCTYPE html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" id="theme-color-meta" content="#12171d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MTProxyL-Panel</title>
    <script>
      (function () {
        var colors = { dark: "#12171d", light: "#f3f5f8", mocha: "#211e1a", parchment: "#f3ead9", matrix: "#050c08" };
        var t = "dark";
        try { t = localStorage.getItem("mtproxyl-panel-theme") || "dark"; } catch (e) {}
        if (t === "system") {
          document.documentElement.removeAttribute("data-theme");
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } else {
          if (!colors[t]) t = "dark";
          document.documentElement.setAttribute("data-theme", t);
        }
        var meta = document.getElementById("theme-color-meta");
        if (meta) meta.setAttribute("content", colors[t]);
      })();
    </script>
  </head>
  <body class="bg-bg text-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
