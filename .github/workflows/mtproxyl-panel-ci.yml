name: MTProxyL-Panel CI

# Scoped to the panel subtree: the rest of the repository is bash and has no
# Go/Node toolchain, so changes there must not trigger this workflow.
on:
  push:
    branches: [ main, dev ]
    paths:
      - 'mtproxyl-panel/**'
      - '.github/workflows/mtproxyl-panel-ci.yml'
  pull_request:
    paths:
      - 'mtproxyl-panel/**'
      - '.github/workflows/mtproxyl-panel-ci.yml'

defaults:
  run:
    working-directory: mtproxyl-panel

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: mtproxyl-panel/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mtproxyl-panel/frontend/package-lock.json

      # The Go binary embeds frontend/dist, so it must exist before any Go
      # command runs — including vet and lint.
      - name: Build frontend (needed for embed)
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Go format check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files not formatted with gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: mtproxyl-panel

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mtproxyl-panel/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: mtproxyl-panel/go.sum

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build backend
        run: go build -v .

      - name: Run tests
        run: go test -v ./...

  # The bash side of MTProxyL is not covered by the workflows above; a syntax
  # check is cheap insurance for the headless-mode patch the panel depends on.
  shellcheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Bash syntax check
        run: |
          for f in mtproxyl.sh lib/*.sh; do
            bash -n "$f" || exit 1
          done
          sh -n mtproxyl-panel/install.sh
