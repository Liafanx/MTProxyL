name: MTProxyL Release

# MTProxyL — это bash, собирать нечего: релиз нужен, чтобы у версии была
# страница с описанием и чтобы её было видно в списке. Текст берём из
# CHANGELOG.md, иначе он разъезжается с тем, что написано в репозитории.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Версия живёт в трёх местах, и забыть любое из них легко. Особенно
      # ./version: по нему check_for_update решает, предлагать ли обновление,
      # и отставший файл делает релиз невидимым для уже установленных копий.
      - name: Check version consistency
        run: |
          ver="${{ steps.version.outputs.value }}"
          rc=0

          file_ver=$(tr -d '[:space:]' < version)
          if [ "$file_ver" != "$ver" ]; then
            echo "./version = '$file_ver', а тег v$ver" >&2
            rc=1
          fi

          script_ver=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' mtproxyl.sh | head -1)
          if [ "$script_ver" != "$ver" ]; then
            echo "mtproxyl.sh VERSION = '$script_ver', а тег v$ver" >&2
            rc=1
          fi

          [ "$rc" -eq 0 ] && echo "версия совпадает везде: $ver"
          exit "$rc"

      # Секция «## vX.Y.Z — дата» до следующего заголовка версии.
      - name: Extract changelog section
        run: |
          awk -v ver="${{ steps.version.outputs.value }}" '
            $0 ~ "^## v" ver "( |$|—)" { found = 1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          # Пустая секция значит, что changelog забыли — это стоит заметить
          # сразу, а не увидеть пустой релиз на странице проекта.
          if [ ! -s release-notes.md ]; then
            echo "В CHANGELOG.md нет секции для версии ${{ steps.version.outputs.value }}" >&2
            exit 1
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "Полный список изменений — [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
          } >> release-notes.md

          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
