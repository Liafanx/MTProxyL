name: MTProxyL Release

# Релиз — страница с описанием из CHANGELOG.md и архив mtproxyl-X.Y.Z.tar.gz:
# из него `mtproxyl update` ставит любую версию и откатывается назад.
# Запуск вручную собирает архив к уже существующему тегу (старые версии).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег, к которому собрать архив (например v1.7.17)'
        required: true

permissions:
  contents: write

concurrency:
  group: mtproxyl-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Скрипт сборки — из текущей ветки, исходники — из тега: так архив
      # собирается и к версиям, выпущенным до появления этого скрипта.
      - name: Checkout tools
        uses: actions/checkout@v6
        with:
          path: tools

      - name: Derive version
        id: version
        env:
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$TAG_INPUT"
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "Тег должен быть vX.Y.Z: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "backfill=${{ github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.version.outputs.tag }}
          path: src

      # Версия живёт в трёх местах, и забыть любое из них легко. Особенно
      # ./version: по нему check_for_update решает, предлагать ли обновление.
      - name: Check version consistency
        working-directory: src
        run: |
          ver="${{ steps.version.outputs.value }}"
          rc=0
          file_ver=$(tr -d '[:space:]' < version)
          [ "$file_ver" = "$ver" ] || { echo "./version = '$file_ver', а тег v$ver" >&2; rc=1; }
          script_ver=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' mtproxyl.sh | head -1)
          [ "$script_ver" = "$ver" ] || { echo "mtproxyl.sh VERSION = '$script_ver', а тег v$ver" >&2; rc=1; }
          [ "$rc" -eq 0 ] && echo "версия совпадает везде: $ver"
          exit "$rc"

      # Одну версию дважды не выкладываем: архив с таким номером уже могли
      # поставить, и другой файл под тем же именем сломал бы откат.
      - name: Refuse duplicate version
        run: |
          ver="${{ steps.version.outputs.value }}"
          asset="mtproxyl-$ver.tar.gz"
          if gh release view "v$ver" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null \
              | grep -qxF "$asset"; then
            echo "Версия $ver уже опубликована с архивом $asset — поднимите номер версии" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            -q '.[] | select(.draft | not) | .tag_name' \
            | grep -E '^v[0-9]+(\.[0-9]+)+$' | sed 's/^v//' | grep -vxF "$ver" > published.txt || true
          echo "уже опубликованы: $(wc -l < published.txt)"
          if [ "${{ steps.version.outputs.backfill }}" != "true" ] && [ -s published.txt ]; then
            newest=$(sort -V published.txt | tail -1)
            if [ "$(printf '%s\n%s\n' "$newest" "$ver" | sort -V | tail -1)" != "$ver" ]; then
              echo "Версия $ver не новее опубликованной $newest" >&2
              exit 1
            fi
          fi

      - name: Build archive
        run: |
          tools/.github/scripts/mtproxyl-archive.sh build src "${{ steps.version.outputs.value }}" dist
          cat dist/*.sha256

      # Тот же код под новым номером — не релиз: откат на «предыдущую»
      # версию ничего бы не менял.
      - name: Refuse unchanged code
        if: steps.version.outputs.backfill != 'true'
        run: |
          ver="${{ steps.version.outputs.value }}"
          prev=$( { cat published.txt; echo "$ver"; } | sort -V | grep -B1 -xF "$ver" | head -1)
          [ -n "$prev" ] && [ "$prev" != "$ver" ] || { echo "предыдущей версии нет"; exit 0; }
          if ! gh release download "v$prev" -R "$GITHUB_REPOSITORY" -p "mtproxyl-$prev.tar.gz" -D prev 2>/dev/null; then
            echo "у v$prev нет архива — сравнить не с чем"
            exit 0
          fi
          if tools/.github/scripts/mtproxyl-archive.sh same "prev/mtproxyl-$prev.tar.gz" "dist/mtproxyl-$ver.tar.gz"; then
            echo "Код v$ver не отличается от v$prev — релиз не нужен" >&2
            exit 1
          fi
          echo "отличается от v$prev"

      # Секция «## vX.Y.Z — дата» до следующего заголовка; секции только
      # панели («## Панель X.Y.Z») в релиз скрипта не попадают.
      - name: Extract changelog section
        run: |
          awk -v ver="${{ steps.version.outputs.value }}" '
            $0 ~ "^## v" ver "( |$|—)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' src/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "В CHANGELOG.md нет секции для версии ${{ steps.version.outputs.value }}" >&2
            exit 1
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "Полный список изменений — [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
            echo ""
            echo "Установить эту версию: \`mtproxyl update --version ${{ steps.version.outputs.value }}\`"
          } >> release-notes.md
          cat release-notes.md

      - name: Publish release
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "$tag" -F release-notes.md --verify-tag
          fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" dist/*
