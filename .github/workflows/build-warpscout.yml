name: Сборка warpscout с настройкой MTU

on:
  push:
    tags: ['warpscout-*-mtproxyl.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REF: v0.16.1
  BUILD_VERSION: 0.16.1-mtproxyl.1

jobs:
  build:
    name: Сборка ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Проверить тег сборки
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "warpscout-$BUILD_VERSION"
      - name: Забрать исходники warpscout
        uses: actions/checkout@v4
        with:
          repository: vernette/warpscout
          ref: ${{ env.SOURCE_REF }}
          path: upstream
      - name: Добавить MTU действующего туннеля
        working-directory: upstream
        run: git apply --check ../.github/patches/warpscout-tunnel-mtu.patch && git apply ../.github/patches/warpscout-tunnel-mtu.patch
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache: false
      - name: Проверить MTU сетевого стека
        working-directory: upstream
        run: go test ./...
      - name: Собрать бинарник
        working-directory: upstream
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -X main.version=$BUILD_VERSION" -o warpscout .
      - name: Проверить совместимость с MTProxyL
        if: matrix.arch == 'amd64'
        working-directory: upstream
        run: |
          set -eu
          HELP="$(./warpscout scan -h 2>&1 || true)$(./warpscout socks -h 2>&1 || true)"
          for flag in best conf endpoint country node table-off no-dns plain tun-ping port tunnel-mtu; do
            echo "$HELP" | grep -q -- "-${flag}" || { echo "Нет ключа -${flag}"; exit 1; }
          done
          test "$(./warpscout version)" = "$BUILD_VERSION"
      - name: Упаковать
        working-directory: upstream
        run: |
          cp LICENSE LICENSE.warpscout
          tar czf "../mtproxyl-warpscout-$BUILD_VERSION-linux-${{ matrix.arch }}.tar.gz" warpscout LICENSE.warpscout
      - uses: actions/upload-artifact@v4
        with:
          name: warpscout-${{ matrix.arch }}
          path: mtproxyl-warpscout-*.tar.gz
          retention-days: 7
  release:
    name: Публикация сборки warpscout
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: warpscout-${{ env.BUILD_VERSION }}
          name: warpscout ${{ env.BUILD_VERSION }} (MTU туннеля)
          body: |
            Сборка [vernette/warpscout](https://github.com/vernette/warpscout),
            исходный тег `${{ env.SOURCE_REF }}`. Добавлен параметр SOCKS `-tunnel-mtu`
            (1000–1500, по умолчанию 1280), применяемый сетевым стеком WG/AWG и MASQUE.
            Параметр `scan -mtu` по-прежнему управляет только экспортом конфигурации.

            Патч и тест сетевого стека: `.github/patches/warpscout-tunnel-mtu.patch`.
            Зависимость MTProxyL для linux/amd64 и linux/arm64.
          files: artifacts/warpscout-*/*.tar.gz
          prerelease: true
          make_latest: false
