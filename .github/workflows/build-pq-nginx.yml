name: Сборка PQ Nginx (OpenSSL статический + nginx + PCRE2)

on:
  workflow_dispatch:
    inputs:
      openssl_version:
        description: 'Версия OpenSSL'
        required: true
        default: '4.1.0'
      nginx_version:
        description: 'Версия nginx'
        required: true
        default: '1.31.9'
      # Пересборка тех же версий с другими ключами configure: без суффикса
      # тег совпал бы с уже опубликованным.
      build_rev:
        description: 'Ревизия сборки, добавляется к тегу (например r2)'
        required: false
        default: ''
      push_release:
        description: 'Опубликовать как Release?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Сборка ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: write

    steps:
      - name: Подготовка Buildx
        uses: docker/setup-buildx-action@v3

      - name: Создание Dockerfile
        shell: bash
        run: |
          cat > Dockerfile.pq << 'EOF'
          FROM debian:11-slim AS builder

          ARG OPENSSL_VER
          ARG NGINX_VER
          ARG PREFIX=/opt/mtproxyl-nginx

          # Debian 11 нужен как нижняя граница glibc.
          RUN printf '%s\n' \
              'deb [check-valid-until=no] http://archive.debian.org/debian bullseye main' \
              'deb [check-valid-until=no] http://archive.debian.org/debian-security bullseye-security main' \
              > /etc/apt/sources.list && \
              apt-get -o Acquire::Retries=3 update -qq && \
              apt-get -o Acquire::Retries=3 install -y -qq \
              build-essential \
              wget \
              ca-certificates \
              zlib1g-dev \
              libpcre2-dev \
              perl \
              binutils \
              file \
              && rm -rf /var/lib/apt/lists/*

          # OpenSSL — статическая сборка
          RUN cd /tmp && \
              wget -q "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VER}/openssl-${OPENSSL_VER}.tar.gz" && \
              tar xzf "openssl-${OPENSSL_VER}.tar.gz" && \
              cd "openssl-${OPENSSL_VER}" && \
              ./Configure no-shared no-tests \
                --prefix=/tmp/openssl-static \
                --openssldir=/tmp/openssl-static/ssl \
                --libdir=lib && \
              make -j"$(nproc)" && \
              make install_sw

          # Проверка OpenSSL
          RUN /tmp/openssl-static/bin/openssl version

          # nginx — OpenSSL статически, PCRE2 системный
          RUN cd /tmp && \
              wget -q "https://nginx.org/download/nginx-${NGINX_VER}.tar.gz" && \
              tar xzf "nginx-${NGINX_VER}.tar.gz" && \
              cd "nginx-${NGINX_VER}" && \
              ./configure \
                --prefix=${PREFIX} \
                --conf-path=${PREFIX}/conf/nginx.conf \
                --error-log-path=/var/log/mtproxyl-nginx/error.log \
                --http-log-path=/var/log/mtproxyl-nginx/access.log \
                --pid-path=/run/mtproxyl-nginx.pid \
                --lock-path=/var/lock/mtproxyl-nginx.lock \
                --http-client-body-temp-path=/var/lib/mtproxyl-nginx/body \
                --http-proxy-temp-path=/var/lib/mtproxyl-nginx/proxy \
                --http-fastcgi-temp-path=/var/lib/mtproxyl-nginx/fastcgi \
                --with-http_ssl_module \
                --with-http_v2_module \
                --with-http_realip_module \
                --with-http_gzip_static_module \
                --with-http_stub_status_module \
                --with-http_sub_module \
                --with-stream \
                --with-stream_ssl_module \
                --with-stream_ssl_preread_module \
                --with-stream_realip_module \
                --with-threads \
                --with-pcre-jit \
                --with-cc-opt="-I/tmp/openssl-static/include" \
                --with-ld-opt="-L/tmp/openssl-static/lib -Wl,-Bstatic -lssl -lcrypto -Wl,-Bdynamic" && \
              make -j"$(nproc)" && \
              make install && \
              mkdir -p ${PREFIX}/bin ${PREFIX}/conf /var/log/mtproxyl-nginx /var/lib/mtproxyl-nginx/body /var/lib/mtproxyl-nginx/proxy /var/lib/mtproxyl-nginx/fastcgi

          # Копируем openssl бинарник
          RUN cp /tmp/openssl-static/bin/openssl ${PREFIX}/bin/openssl

          # Проверка: nginx запускается
          RUN ${PREFIX}/sbin/nginx -V > /tmp/nginx-version.txt 2>&1 && \
              cat /tmp/nginx-version.txt && \
              grep -F "nginx/${NGINX_VER}" /tmp/nginx-version.txt && \
              grep -F "built with OpenSSL ${OPENSSL_VER}" /tmp/nginx-version.txt

          # Проверка: openssl запускается
          RUN ${PREFIX}/bin/openssl version && \
              ${PREFIX}/bin/openssl list -kem-algorithms | grep -Ei 'ML[-_]?KEM[-_]?768'

          # Проверка: OpenSSL НЕ в динамических зависимостях
          RUN ldd ${PREFIX}/sbin/nginx > /tmp/nginx-ldd.txt && \
              ! grep -Eiq 'libssl|libcrypto|not found' /tmp/nginx-ldd.txt

          # Проверка: бинарь использует PCRE2, а не старый PCRE1
          RUN ldd ${PREFIX}/sbin/nginx | tee /tmp/nginx-ldd.txt && \
              grep -q 'libpcre2-8' /tmp/nginx-ldd.txt && \
              ! grep -q 'libpcre.so.3' /tmp/nginx-ldd.txt

          # Проверка GLIBC
          RUN echo "Требуемая GLIBC:" && \
              objdump -T ${PREFIX}/sbin/nginx | grep -oP 'GLIBC_[0-9.]+' | sort -V | uniq | tail -1

          # Проверка архитектуры бинаря
          RUN file ${PREFIX}/sbin/nginx && file ${PREFIX}/bin/openssl

          FROM scratch AS artifact
          COPY --from=builder /opt/mtproxyl-nginx /opt/mtproxyl-nginx
          EOF

      - name: Сборка архива ${{ matrix.arch }}
        shell: bash
        env:
          OPENSSL_VER: ${{ inputs.openssl_version }}
          NGINX_VER: ${{ inputs.nginx_version }}
        run: |
          [[ "$OPENSSL_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$NGINX_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p out

          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --build-arg OPENSSL_VER="$OPENSSL_VER" \
            --build-arg NGINX_VER="$NGINX_VER" \
            --output type=local,dest=./out \
            -f Dockerfile.pq .

          ARCHIVE="mtproxyl-pq-nginx-${NGINX_VER}-openssl${OPENSSL_VER}-linux-${{ matrix.arch }}.tar.gz"
          tar czf "${ARCHIVE}" -C out opt/mtproxyl-nginx
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: pq-nginx-${{ matrix.arch }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          retention-days: 7

  release:
    name: Публикация Release
    needs: build
    if: github.event.inputs.push_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Скачать артефакты
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Показать файлы
        run: find artifacts -type f -maxdepth 3

      - name: Создать Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pq-nginx-${{ github.event.inputs.nginx_version }}-openssl${{ github.event.inputs.openssl_version }}${{ github.event.inputs.build_rev && format('-{0}', github.event.inputs.build_rev) || '' }}
          name: "PQ Nginx ${{ github.event.inputs.nginx_version }} + OpenSSL ${{ github.event.inputs.openssl_version }}"
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            ## nginx ${{ github.event.inputs.nginx_version }} + OpenSSL ${{ github.event.inputs.openssl_version }}

            Собран для MTProxyL selfmask.

            ### Особенности
            - OpenSSL слинкован **статически**
            - PCRE используется через **PCRE2**
            - Совместимо с **Debian 13+**
            - Поддерживает **X25519MLKEM768**
            - Собран со **stream** и **ssl_preread** — нужен для WEB Proxy

            ### Совместимость
            - Debian 11+
            - Ubuntu 20.04+
            - Debian 13 требует `libpcre2-8-0`

            ### Архитектуры
            - `linux/amd64`
            - `linux/arm64`

            ### Установка
            MTProxyL selfmask скачивает и устанавливает автоматически.

            ### Ручная проверка
            ```bash
            tar xzf mtproxyl-pq-nginx-*.tar.gz -C /
            /opt/mtproxyl-nginx/bin/openssl version
            /opt/mtproxyl-nginx/sbin/nginx -V 2>&1
            ldd /opt/mtproxyl-nginx/sbin/nginx | grep -E 'ssl|crypto'   # должно быть пусто
            ldd /opt/mtproxyl-nginx/sbin/nginx | grep pcre2             # должна быть libpcre2-8.so.0
            ldd /opt/mtproxyl-nginx/sbin/nginx | grep 'libpcre.so.3'    # должно быть пусто
            ```
          files: |
            artifacts/pq-nginx-amd64/*.tar.gz*
            artifacts/pq-nginx-arm64/*.tar.gz*
          draft: false
          prerelease: false
