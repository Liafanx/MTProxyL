name: MTProxyL-Panel Release

# Панель версионируется отдельно от MTProxyL: у неё свой цикл выпуска,
# поэтому тег с собственным префиксом, а не общий тег репозитория.
on:
  push:
    tags:
      - 'mtproxyl-panel-v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: mtproxyl-panel

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mtproxyl-panel/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: mtproxyl-panel/go.sum

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#mtproxyl-panel-v}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # Проверки перед публикацией: сломанный релиз хуже отсутствующего.
      - name: Verify
        run: |
          go vet ./...
          go test ./...

      # release-binaries, а не release: фронтенд собран шагом выше, и цель
      # release пересобрала бы его вторым npm ci.
      - name: Build binaries
        run: make release-binaries VERSION=${{ steps.version.outputs.value }}

      # Внешний API — отдельный бинарник того же модуля: MTProxyL ставит его
      # командой `mtproxyl api on`, панель для этого не нужна.
      - name: Build mtproxyl-api
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }}" \
              -o "release/mtproxyl-api-linux-$arch" ./cmd/mtproxyl-api
            (cd release && sha256sum "mtproxyl-api-linux-$arch" > "mtproxyl-api-linux-$arch.sha256")
          done

      # Установщик распаковывает архив и передаёт install(1) путь
      # mtproxyl-panel-<arch>-linux, то есть внутри должен лежать ФАЙЛ с этим
      # именем, а не каталог. Бинарник статический (CGO отключён), поэтому одна
      # сборка годится и для glibc, и для musl — раскладываем её под оба имени,
      # чтобы обе ветки выбора нашли своё.
      - name: Package archives
        run: |
          cd release
          for arch in x86_64 aarch64; do
            bin="mtproxyl-panel-${arch}-linux"
            [ -f "$bin" ] || { echo "missing $bin"; exit 1; }
            for libc in gnu musl; do
              tar czf "mtproxyl-panel-${arch}-linux-${libc}.tar.gz" "$bin"
            done
          done
          # Два разных потребителя — два формата. install.sh (первая установка)
          # грепает имя архива в одном общем checksums.txt. Само же обновление
          # панели (internal/panel_updater, унаследовано от telemt_panel) ищет
          # отдельный "<архив>.sha256" на каждый tar.gz и без него отказывает
          # с "has no checksum asset", даже когда архив на месте.
          sha256sum ./*.tar.gz | sed 's|\./||' > checksums.txt
          for f in ./*.tar.gz; do
            sha256sum "$f" | sed 's|\./||' > "${f%.tar.gz}.sha256"
          done
          cat checksums.txt

      # Описание релиза берётся из подготовленного файла без автодополнений.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mtproxyl-panel/release/*.tar.gz
            mtproxyl-panel/release/mtproxyl-api-linux-amd64
            mtproxyl-panel/release/mtproxyl-api-linux-arm64
            mtproxyl-panel/release/*.sha256
            mtproxyl-panel/release/checksums.txt
          body_path: mtproxyl-panel/RELEASE_NOTES.md
